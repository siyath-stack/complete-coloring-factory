name: Generate Daily Coloring Book

on:
  schedule:
    # Runs at 01:00 UTC daily (right after Cloudflare quota resets)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pillow

      # Step 1: Research today's viral theme and check deduplication history
      - name: Research trending theme
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python research_trend.py

      # Step 2: Build the high-end 34-page book
      - name: Generate coloring book PDF
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python generate_book.py

      # Step 3: Commit updated used_topics.json back to repository
      - name: Commit history to repo
        run: |
          git config --global user.name "Daily Book Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add used_topics.json
          git commit -m "chore: record daily generated theme [skip ci]" || echo "No changes to commit"
          git push

      # Step 4: Upload PDF as a Release or Artifact
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-coloring-book
          path: "*.pdf"
