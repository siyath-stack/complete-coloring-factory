name: Generate Daily Coloring Book

on:
  schedule:
    # 01:00 AM UTC daily (1 hour after Cloudflare daily neuron refresh)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pillow

      # Step 1: Discover trending topic and write 30 habitat-accurate scenes
      - name: Research trending theme
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python research_trend.py

      # Step 2: Compile the 35-page high-end PDF
      - name: Generate coloring book PDF
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python generate_book.py

      # Step 3: Record topic history so themes never repeat
      - name: Commit history to repository
        run: |
          git config --global user.name "Coloring Factory Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add used_topics.json daily_book_plan.json
          git commit -m "chore: record daily generated theme and plan [skip ci]" || echo "No changes to commit"
          git push

      # Step 4: Save compiled book as a GitHub artifact
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-coloring-book
          path: "*.pdf"
